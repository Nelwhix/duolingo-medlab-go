<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Questions &mdash; MedLab Admin</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="h-screen overflow-hidden bg-slate-100 flex">

    <!-- Sidebar -->
    <aside class="w-64 h-screen shrink-0 bg-white border-r border-slate-200 flex flex-col">
        <div class="px-6 py-5 border-b border-slate-200">
            <h1 class="text-xl font-bold text-slate-800">MedLab</h1>
            <p class="text-xs text-slate-500 mt-0.5">Admin Panel</p>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="/admin/questions"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-slate-100 text-slate-900 transition">
                <svg class="w-4 h-4 text-slate-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
                </svg>
                Questions
            </a>
        </nav>

        <div class="px-3 py-4 border-t border-slate-200">
            <form action="/admin/logout" method="POST">
                <button type="submit"
                        class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100 hover:text-slate-900 transition">
                    <svg class="w-4 h-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
                    </svg>
                    Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between" style="height: 87px;">
            <h2 class="text-lg font-semibold text-slate-800">Questions</h2>
            <a href="/admin/questions/create"
               class="inline-flex items-center gap-2 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold px-4 py-2.5 transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Create Question
            </a>
        </header>

        <div class="flex-1 px-8 py-6">
            {{if .Questions}}
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 bg-slate-50">
                            <th class="text-left px-5 py-3 font-medium text-slate-600">Topic</th>
                            <th class="text-left px-5 py-3 font-medium text-slate-600">Type</th>
                            <th class="text-left px-5 py-3 font-medium text-slate-600">Department</th>
                            <th class="text-left px-5 py-3 font-medium text-slate-600">Date Created</th>
                            <th class="px-5 py-3"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        {{range .Questions}}
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-5 py-3.5 text-slate-800 font-medium">{{.Topic}}</td>
                            <td class="px-5 py-3.5">
                                <span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-blue-50 text-blue-700">
                                    {{.Type}}
                                </span>
                            </td>
                            <td class="px-5 py-3.5 text-slate-600">{{.Department.Title}}</td>
                            <td class="px-5 py-3.5 text-slate-500">{{formatDate .CreatedAt}}</td>
                            <td class="px-5 py-3.5 text-right">
                                <div class="flex items-center justify-end gap-4">
                                    <a href="/admin/questions/{{.ID}}" class="text-blue-600 hover:text-blue-800 font-medium transition">View</a>
                                    <form action="/admin/questions/{{.ID}}/delete" method="POST" onsubmit="return confirm('Are you sure you want to delete this question?')">
                                        <button type="submit" class="text-slate-400 hover:text-red-600 transition">
                                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                            </svg>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {{end}}
                    </tbody>
                </table>
            </div>
            {{else}}
            <div class="flex flex-col items-center justify-center h-64 text-center">
                <svg class="w-10 h-10 text-slate-300 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
                </svg>
                <p class="text-slate-500 text-sm font-medium">No questions yet</p>
                <p class="text-slate-400 text-xs mt-1">Click "Create Question" to add your first one.</p>
            </div>
            {{end}}
        </div>
    </main>

</body>
</html>
