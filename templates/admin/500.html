<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Something went wrong &mdash; MedLab Admin</title>
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm md:p-12">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-50 text-red-600">
                <svg class="h-8 w-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9.303 3.376c.866 1.5-.217 3.374-1.948 3.374H4.645c-1.73 0-2.813-1.874-1.948-3.374L10.052 3.38c.866-1.5 3.03-1.5 3.896 0l7.355 12.746ZM12 15.75h.008v.008H12v-.008Z" />
                </svg>
            </div>
            <p class="mt-6 text-sm font-semibold uppercase tracking-widest text-red-600">Error 500</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-900 md:text-3xl">Something went wrong</h1>
            <p class="mx-auto mt-3 max-w-sm text-sm leading-6 text-slate-500">
                We couldn&rsquo;t complete your request. Please try again, or return to the admin dashboard.
            </p>
            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
                <button type="button" onclick="window.location.reload()" class="rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Try again
                </button>
                <a href="/admin/dashboard" class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Back to dashboard
                </a>
            </div>
        </section>
    </main>
</body>
</html>
