services:
  db:
    image: postgres:18-alpine
    container_name: duolingo-medlab-db
    # local dev only - default creds, do not use in prod
    environment:
      POSTGRES_USER: nelwhix
      POSTGRES_PASSWORD: Password123!
      POSTGRES_DB: duolingo-medlab-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
